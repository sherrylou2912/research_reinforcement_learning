# ===================== SAC Configuration =====================
# Soft Actor-Critic algorithm specific settings
# Inherits base settings and adds SAC-specific parameters

# Import base configuration
defaults:
  - base

# ===================== SAC-Specific Parameters =====================
alpha: 0.2             # SAC temperature parameter for entropy regularization
target_entropy: null   # Target entropy (-dim(action_space) if null)
auto_tune_alpha: false  # Enable automatic temperature tuning

# ===================== Override Base Settings =====================
# Customize base parameters for SAC
episodes: 200        # More episodes for SAC convergence
batch_size: 2048  # Larger batch size for stable gradients
project_name: "SAC Offline RL"
group: "sac-experiments"
name: "sac_default"
use_wandb: true

# ===================== Advanced SAC Settings =====================
# Fine-tuning parameters for expert users
critic_lr: 0.0003      # Critic learning rate (can differ from actor)
actor_lr: 0.0003       # Actor learning rate
alpha_lr: 0.0003       # Alpha (temperature) learning rate
reward_scale: 1.0      # Reward scaling factor
update_after: 1000     # Start updates after N steps
update_every: 50       # Update frequency 